#
# ruff, ruff format, mypy --strict and pytest on 3.11 to 3.13, and the Atheris
# fuzz targets. The jobs live in ChiefGyk3D/git-your-ship-together; its
# `CI green` job is the one check branch protection watches (`ci / CI green`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 5 * * 1"   # the weekly long fuzz run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@1360d100a45897b2d658272441bc5238d6532743 # v1.16.0
    permissions:
      contents: read
      id-token: write   # Doppler OIDC, when a Doppler identity is configured
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      install-command: |
        python -m pip install --upgrade "pip>=25.3"
        pip install -e ".[dev]"
      test-command: pytest -W error::DeprecationWarning
      lint-install-command: pip install -e ".[dev]"
      lint-command: ruff check --output-format=github src tests fuzz && ruff format --check src tests fuzz && mypy
      docker-build: false
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}

  # Atheris targets under fuzz/ (gpsd's JSON stream, the NMEA sentence builder,
  # the GET /position request head, the command-line values), run by GYST: 30
  # seconds each on a pull request, 10 minutes each on the Monday schedule. A
  # crash fails the job; the input is the fuzz-findings artifact.
  fuzz:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-fuzz.yml@1360d100a45897b2d658272441bc5238d6532743 # v1.16.0
    permissions:
      contents: read
    with:
      seconds-per-target: ${{ github.event_name == 'schedule' && 600 || 30 }}
      timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 30 }}
      install-command: pip install -e .
      egress-policy: block
